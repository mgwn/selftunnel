name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'

      - name: Install GUI build dependencies
        # The Fyne GUI client is part of ./... for lint/vet/test; its cgo
        # dependencies (OpenGL, X11, Wayland) need these dev packages on
        # headless runners. See scripts/ci/gui-deps.sh for the package map.
        run: bash scripts/ci/gui-deps.sh

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Lint
        run: |
          GOBIN="$PWD/.gobin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          GOTOOLCHAIN=go1.26.8 .gobin/golangci-lint run

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race + coverage gate)
        run: bash tests/pipeline/coverage.sh

      - name: Cross-compile
        run: bash tests/pipeline/crosscompile.sh

      - name: Smoke test
        run: bash tests/pipeline/smoke.sh

      - name: Build server and CLI client
        run: |
          CGO_ENABLED=0 go build ./cmd/selftunnel-server
          CGO_ENABLED=0 go build ./cmd/selftunnel-client

      - name: Build server image
        run: docker build -t selftunnel:ci .
