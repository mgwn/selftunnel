<?xml version="1.0" encoding="UTF-8"?>
<!-- selftunnel logo: "light at the end of the tunnel".
     Concentric portal rings recede toward a warm focal point — a request
     entering the tunnel and coming out the other side. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3c7" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#fcd34d" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fcd34d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- portal rings, outer to inner -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="22"/>
  <circle cx="256" cy="256" r="128" fill="none" stroke="#ffffff" stroke-opacity="0.42" stroke-width="18"/>
  <circle cx="256" cy="256" r="86"  fill="none" stroke="#ffffff" stroke-opacity="0.68" stroke-width="14"/>

  <!-- the light -->
  <circle cx="256" cy="256" r="72" fill="url(#glow)"/>
  <circle cx="256" cy="256" r="44" fill="#fbbf24"/>
</svg>
