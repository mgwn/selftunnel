# Use this when you have already built ./selftunnel-server-linux locally or via Dockerfile.build.
#
#   ./build.sh                         # produces selftunnel-server-linux
#   docker compose -f docker-compose.runtime.yml up --build

services:
  selftunnel-server:
    build:
      context: .
      dockerfile: Dockerfile.runtime
    image: selftunnel:latest
    container_name: selftunnel
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
